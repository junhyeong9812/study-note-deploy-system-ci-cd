# 역할별 서비스 분리(리뷰 F4) — master는 docker.sock·저장소 마운트 없음(접수·진행·이력만).
# .9:      docker compose --profile master --profile agent up -d --build
# 그 외:   docker compose --profile agent up -d --build
services:
  master:
    build: .
    profiles: ["master"]
    container_name: ci-cd-master
    network_mode: host
    env_file: .env.master
    environment:
      DEPLOY_DB_PATH: /data/deploys.db                 # 아래 볼륨과 짝 — 작업 디렉토리에 기대지 않는다
    volumes:
      - ./data:/data                                   # 배포 이력 DB(SQLite) · 실패 출력(/data/failure-outputs) — 재시작해도 남는다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:15000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:                                           # 접속 줄(통신 규약 3.4)이 표준 출력으로 간다 — nginx 여섯과 같은 상한(3.6)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build: .
    profiles: ["agent"]
    container_name: ci-cd-agent
    network_mode: host
    env_file: .env.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock     # agent만 — 호스트 docker 제어
      - ${HOME}/study-note-deploy-system-front:${HOME}/study-note-deploy-system-front
      - ${HOME}/study-note-deploy-system-backend:${HOME}/study-note-deploy-system-backend
      - ${HOME}/study-note-deploy-system-llm:${HOME}/study-note-deploy-system-llm
      - ${HOME}/study-note-deploy-system-alert:${HOME}/study-note-deploy-system-alert
      - ${HOME}/study-note-deploy-system-observe:${HOME}/study-note-deploy-system-observe
      - ${HOME}/study-note-deploy-system-admin:${HOME}/study-note-deploy-system-admin
      - ${HOME}/study-note-deploy-system-claude:${HOME}/study-note-deploy-system-claude
      - ./data-agent:/data                             # 통신 수집의 읽은 자리 파일(traffic-cursor.json) — 컨테이너를 다시 만들어도 남는다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:15001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:                                           # 접속 줄(통신 규약 3.4)이 표준 출력으로 간다 — nginx 여섯과 같은 상한(3.6)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
